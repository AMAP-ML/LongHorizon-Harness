name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: 🔍 Verify the lockfile resolves only to the public registry
        # A private/mirror registry URL committed into package-lock.json makes
        # this job hang until it times out on a runner that cannot reach it.
        run: |
          foreign="$(grep -o '"resolved": "https://[^/]*' frontend/web/package-lock.json \
            | grep -v '"resolved": "https://registry.npmjs.org$' | sort -u || true)"
          if [ -n "$foreign" ]; then
            echo "$foreign"
            echo "::error::package-lock.json resolves packages outside registry.npmjs.org"
            exit 1
          fi

      - name: 📦 Install Web dependencies
        run: npm ci --prefix frontend/web --no-audit --no-fund

      - name: 🧪 Test shared frontend core
        # frontend/core has no lockfile of its own; its test script reuses the
        # esbuild installed for the Web app.
        run: npm test --prefix frontend/web

      - name: 🖥️ Build Web frontend
        # Vite writes straight into src/lh_harness/_frontend/web/dist.
        run: npm run build --prefix frontend/web

      - name: 🔍 Verify the Web bundle was produced
        run: test -f src/lh_harness/_frontend/web/dist/index.html

      - name: 🧪 Run Python tests
        run: python -m pip install -e '.[test]' && python -m pytest -q

      - name: 📦 Install build tooling
        # twine >= 7 is required to validate PEP 639 license metadata.
        run: python -m pip install --upgrade build "twine>=7"

      - name: 🏗️ Build sdist and wheel
        # The default flow builds the wheel from the sdist, so this also proves
        # the git-ignored bundle survives the sdist round-trip.
        run: python -m build

      - name: 🔍 Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: 🔍 Verify the sdist carries the Web bundle
        run: |
          python - <<'PY'
          import glob, tarfile
          archive = sorted(glob.glob("dist/*.tar.gz"))[0]
          with tarfile.open(archive) as bundle:
              names = bundle.getnames()
          prefix = "src/lh_harness/_frontend/web/dist/"
          assets = [name for name in names if prefix in name]
          assert any(name.endswith("/index.html") for name in assets), assets
          assert len(assets) > 1, assets
          print(archive, len(assets), "bundled files")
          PY

      - name: 📦 Smoke-test wheel contents
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/pip" install --no-deps dist/*.whl
          "$smoke_dir/venv/bin/python" -c 'import lh_harness; print(lh_harness.__version__)'
          "$smoke_dir/venv/bin/python" -c 'from pathlib import Path; import lh_harness; p=Path(lh_harness.__file__).parent/"_frontend"/"web"/"dist"; assert (p/"index.html").is_file(), p; assert sum(item.is_file() for item in p.rglob("*")) > 1, p; print(p)'

      - name: 🏷️ Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject: $project_version / tag: $tag_version"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $project_version"
            exit 1
          fi

      - name: 📤 Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: 🚀 Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lh-harness
    permissions:
      id-token: write
    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: 🏷️ Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🏷️ Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

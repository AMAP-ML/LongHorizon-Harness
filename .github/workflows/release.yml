name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install build tooling
        # twine >= 7 is required to validate PEP 639 license metadata.
        run: python -m pip install --upgrade build "twine>=7"

      - name: 🏗️ Build sdist and wheel
        run: python -m build

      - name: 🔍 Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: 🏷️ Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject: $project_version / tag: $tag_version"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $project_version"
            exit 1
          fi

      - name: 📤 Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: 🚀 Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lh-harness
    permissions:
      id-token: write
    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: 🏷️ Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🏷️ Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-harness"
version = "0.1.3"
description = "Recursive-decomposition harness for long-horizon tasks, driven by gptme"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "long-horizon", "computer-use", "llm"]
dependencies = [
    "packaging",
    "tomli; python_version < '3.11'",
]

# Only GptmeAdapter's subprocess worker (adapters/_gptme_worker.py) imports
# gptme -- the core package, every other adapter, and the test suite stay
# gptme-free. Install with `pip install "lh-harness[gptme]"` to actually run
# GptmeAdapter as a Writer backend.
#
# Pinned to a minor version, not left open: gptme is pre-1.0, so a minor
# bump (0.32 -> 0.33) can break API compatibility under semver convention,
# and the worker calls a few gptme internals (gptme.chat, gptme.get_prompt,
# gptme.tools.init_tools/ToolSpec/load_from_file) that were verified
# against a real installed package via inspect, not against a documented,
# version-guaranteed public API. Bump this deliberately -- after running
# the test suite and a real GptmeAdapter episode by hand -- not by letting
# `pip install --upgrade` silently pull a newer minor version.
[project.optional-dependencies]
gptme = ["gptme>=0.32.1,<0.33"]

[project.urls]
Homepage = "https://github.com/AMAP-ML/LongHorizon-Harness"
Issues = "https://github.com/AMAP-ML/LongHorizon-Harness/issues"

[project.scripts]
lh-harness = "lh_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_harness"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/lh_harness",
    "/pyproject.toml",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
]

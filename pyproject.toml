[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kusudaemon"
version = "0.1.3"
description = "Recursive-decomposition harness for long-horizon tasks, driven by gptme"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "long-horizon", "computer-use", "llm"]
dependencies = [
    "packaging",
    "tomli; python_version < '3.11'",
]

# Only GptmeAdapter's subprocess worker (adapters/_gptme_worker.py) imports
# gptme -- the core package, every other adapter, and the test suite stay
# gptme-free. Install with `pip install "kusudaemon[gptme]"` to actually run
# GptmeAdapter as a Writer backend.
#
# Only src/kusudaemon/tui/ imports textual -- the core package, every other
# module, and the test suite stay textual-free (tests exercise tui/state.py
# directly, never the widget tree). Install with `pip install
# "kusudaemon[tui]"` to actually run `kusudaemon tui` / bare `kusudaemon`.
[project.optional-dependencies]
gptme = ["gptme"]
tui = ["textual>=0.60"]

# Points at this fork's actual GitHub location, which has not itself been
# renamed (only the package/CLI/docs have) -- update if/when it is.
[project.urls]
Homepage = "https://github.com/OrigamiKoala/LongHorizon-Harness"
Issues = "https://github.com/OrigamiKoala/LongHorizon-Harness/issues"

[project.scripts]
kusudaemon = "kusudaemon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kusudaemon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/kusudaemon",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]
